<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenLib - Danh sách Sách</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>📚 Hệ Thống Thư Viện OpenLib</h1>
        <p style="text-align: center;">Danh mục sách hiện có trong hệ thống</p>
        
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Tên sách (Title)</th>
                    <th>Mã ISBN</th>
                    <th>Năm XB</th>
                    <th>Tồn kho (Stock)</th>
                </tr>
            </thead>
            <tbody id="book-list-body">
                <tr>
                    <td colspan="5" style="text-align: center;">Đang tải dữ liệu từ Backend...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
